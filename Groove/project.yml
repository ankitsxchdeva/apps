name: Groove
options:
  bundleIdPrefix: com.ankit
  deploymentTarget:
    iOS: "17.0"
packages:
  DesignSystem:
    path: ../DesignSystem
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
targets:
  Groove:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Shared, Resources]
    dependencies:
      - package: DesignSystem
      - target: GrooveWidgets
    entitlements:
      path: Groove.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ankit.Groove
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  GrooveWidgets:
    type: app-extension
    platform: iOS
    sources: [Sources/Shared, Sources/Widgets]
    dependencies:
      - package: DesignSystem
    entitlements:
      path: GrooveWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ankit.Groove
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Groove
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ankit.Groove.GrooveWidgets
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  Groove:
    build:
      targets:
        Groove: all
    run:
      config: Debug
