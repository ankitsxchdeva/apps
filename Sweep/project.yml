name: Sweep
options:
  bundleIdPrefix: com.ankit
  deploymentTarget:
    iOS: "17.0"
packages:
  DesignSystem:
    path: ../DesignSystem
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
targets:
  Sweep:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: DesignSystem
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sweep shows your photos so you can decide what to keep and what to let go."
schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
