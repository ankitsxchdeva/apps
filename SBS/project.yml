name: SBS
options:
  bundleIdPrefix: com.ankit
  deploymentTarget:
    iOS: "17.0"
packages:
  DesignSystem:
    path: ../DesignSystem
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
targets:
  SBS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: DesignSystem
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: SBS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Portrait-only, so opt out of iPad-style multitasking layouts.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Uses no encryption beyond what iOS provides; skips the export prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: SBS connects to your coffee scales to record each pour side by side.
  SBSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SBS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SBS:
    build:
      targets:
        SBS: all
    run:
      config: Debug
    test:
      targets: [SBSTests]
